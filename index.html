<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141842">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星空時間">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/polaris-64.png">
<link rel="apple-touch-icon" href="icons/polaris-apple-180.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<title>星空時間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one calm phone-width column under a night sky, views swapped in place, a fixed bottom tab bar (海月時間シリーズと同じ骨組み) */
:root{
  --bg:#EDEFF8; --bg-top:#D6DBF0; --surface:#FFFFFF; --sunk:#E3E6F3; --ink:#161B3A; --muted:#565E85; --line:#CBD0E6;
  --teal:#3445A3; --teal-soft:#DDE1F6; --accent:#D9A520; --accent-soft:#FBF0D2; --accent-ink:#4E3800;
  --good:#23845A; --good-bg:#DCF1E6; --bad:#B9503A; --bad-bg:#F8E1DA;
  --night1:#2A2F6E; --night2:#141842; --night3:#070923; --star:#FFE9A8; --night-ink:#E8EAFB; --night-muted:#B9BEE6;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090C22; --bg-top:#151A45; --surface:#121735; --sunk:#0D1130; --ink:#E6E8FA; --muted:#A0A6D0; --line:#252B55;
  --teal:#A3AEF5; --teal-soft:#1D2457; --accent:#F2C95B; --accent-soft:#3A2E10; --accent-ink:#FBE7B0;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090C22; --bg-top:#151A45; --surface:#121735; --sunk:#0D1130; --ink:#E6E8FA; --muted:#A0A6D0; --line:#252B55;
  --teal:#A3AEF5; --teal-soft:#1D2457; --accent:#F2C95B; --accent-soft:#3A2E10; --accent-ink:#FBE7B0;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 360px) no-repeat;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:1rem;color:var(--teal);font-weight:700;white-space:nowrap;flex:none}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hello{padding-block:10px 4px}
.hello .eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--teal);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}

.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,var(--night1),var(--night2));color:var(--night-ink);border:0;border-radius:14px;padding:16px 18px}
.continue small{display:block;opacity:.85;font-size:.8rem}
.continue strong{font-family:var(--f-display);font-size:1.1rem}
.continue .go{font-size:1.4rem;color:var(--star)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subjects .subj:last-child:nth-child(odd){grid-column:1/-1}
.subj{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:92px}
.subj .k{font-family:var(--f-display);font-size:1.6rem;font-weight:900;line-height:1;color:var(--teal)}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj .small{line-height:1.45}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[disabled]{opacity:.5;cursor:default}
.item .body{flex:1;min-width:0}
.item .chev{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.mid{background:var(--accent-soft);color:var(--accent-ink)}
.lid{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.9rem}
.lid.done{background:var(--teal);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--teal);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#2B1F00}
.btn.wide{width:100%}
.btn.again{background:var(--teal-soft);color:var(--teal);border:2px solid var(--teal)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.subj:focus-visible,.choice:focus-visible,.card:focus-visible,.tab:focus-visible,.rflip:focus-visible,.continue:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* lesson */
.lesson section{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.75}
.ex{font-family:var(--f-display);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.fx{background:var(--sunk);border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.8}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain span{background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.92rem}
.chain i{font-style:normal;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.scroll{overflow-x:auto}
.fig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.fig text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.fig .lb{font-weight:700}
.fig .ch{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.fig .chL{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fig .wl{fill:none;stroke:var(--teal);stroke-width:2}
.fig .mu{fill:var(--muted);font-size:10.5px}
.fig .ac{fill:var(--accent)}
.fig .grid{stroke:var(--line);stroke-width:1}
.lsec{padding:10px 16px 6px;border-top:1px solid var(--line);background:var(--sunk);color:var(--teal);font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.06em}
.lsec:first-child{border-top:0}
.lsec+.item{border-top:1px solid var(--line)}
.stars{color:var(--accent);font-size:.78rem;letter-spacing:.04em;margin-right:6px;white-space:nowrap}
.note-box{background:var(--sunk);border-color:transparent;display:flex;flex-direction:column;gap:10px}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.9rem}

/* cards */
.card{position:relative;width:100%;min-height:230px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.card .side{font-size:.75rem;letter-spacing:.1em;color:var(--teal);font-weight:700}
.card .term{font-family:var(--f-display);font-size:1.7rem;font-weight:900}
.card .def{font-size:1.02rem;line-height:1.8;max-width:30em}
.card.flipped{background:var(--teal-soft)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.qbox .prompt{color:var(--muted);font-size:.92rem}
.qbox .expr{font-family:var(--f-display);font-size:1.6rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.5}
.qbox .expr.long{font-size:1.12rem;font-weight:700;line-height:1.7;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{font-size:1.02rem;padding:12px;text-align:left}
.choice.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)}
.feedback.ng{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.feedback.ok .verdict{color:var(--good)} .feedback.ng .verdict{color:var(--bad)}
.hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--f-display);font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);line-height:1.1}

/* record */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:var(--teal);color:var(--surface);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--good)}
.status.wait::before{background:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.tab.on{color:var(--teal)}

@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}

/* night sky hero */
.sky{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(175deg,var(--night1) 0%,var(--night2) 55%,var(--night3) 100%);color:var(--night-ink);padding:22px 18px 20px;min-height:176px;display:flex;align-items:flex-end}
.sky .art{position:absolute;inset:0;width:100%;height:100%}
.sky .txt{position:relative;z-index:1;max-width:64%;display:flex;flex-direction:column;gap:4px}
.sky .name{font-family:var(--f-display);font-weight:900;font-size:1.05rem;letter-spacing:.2em;color:var(--star)}
.sky h1{color:#F4F5FF;font-size:1.45rem}
.sky p{color:var(--night-muted);font-size:.88rem}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes shoot{0%,78%{opacity:0;transform:translate(0,0)}82%{opacity:1}100%{opacity:0;transform:translate(-120px,60px)}}
.shoot{animation:shoot 9s ease-in infinite}

/* reward card */
.rcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.rlead{font-family:var(--f-display);font-weight:700;color:var(--teal);text-align:center}
.rflip{border:0;padding:0;background:none;width:min(100%,300px);max-width:100%;aspect-ratio:3/4;perspective:1200px;cursor:pointer}
.rflip[disabled]{cursor:default}
.rinner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.rcard.open .rinner{transform:rotateY(180deg)}
.rback,.rfront{position:absolute;inset:0;border-radius:18px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 12px 30px rgba(7,9,35,.35)}
.rback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 80% at 50% 0%,#3B44A0 0%,#171C4E 55%,#070923 100%);border:3px solid #E9C76A;color:#F2E2B0}
.rback svg{width:56%;height:auto}
.rhint{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:.95rem;padding:6px 14px;border-radius:99px;background:rgba(242,201,91,.16)}
.rcard:not(.open) .rflip{animation:nudge 2.6s ease-in-out 1s infinite}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}}
.rfront{transform:rotateY(180deg);background:#0B0E2A;border:3px solid #A3AEF5}
.rfront img,.rfront svg{display:block;width:100%;height:100%;object-fit:cover}
.rfront.fit{background:#070A20}
.rfront.fit img{object-fit:contain}
.rcap,.viewer figcaption{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rcap{transition:opacity .4s ease .55s}
.rcard:not(.open) .rcap{opacity:0;visibility:hidden}
.rno{font-size:.8rem;letter-spacing:.06em;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.rno em{font-style:normal;background:var(--accent);color:#2B1F00;border-radius:99px;padding:0 9px;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.rname{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.rnote{font-size:.9rem;color:var(--muted)}
.rcount{font-size:.76rem;color:var(--muted);margin-top:4px}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.coll>*{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;border:0;padding:0}
.coll button{cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.coll img,.coll svg{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(5,7,25,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));color:#E8EAFB}
.viewer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}
.viewer img,.viewer .vsvg{max-width:100%;max-height:66vh;border-radius:14px;object-fit:contain;display:block}
.viewer .vsvg{width:min(100%,46vh)}
.viewer .vsvg svg{width:100%;height:auto;display:block;border-radius:14px}
.viewer .rno,.viewer .rnote{color:#B9BEE6}

/* grow a star */
.skybox{border-radius:22px;overflow:hidden;background:linear-gradient(175deg,#232867 0%,#10143C 58%,#05071C 100%);color:#E8EAFB}
.skybox .night{display:block;width:100%;height:auto}
.skycount{display:flex;justify-content:space-between;padding:8px 16px 12px;font-size:.82rem;color:#C6CAEE}
.skycount b{color:#fff;font-size:1rem}
.night .tw{animation-duration:4s}
.stg{width:150px;max-width:42%;height:auto;flex:none;background:linear-gradient(175deg,#232867,#10143C);border-radius:16px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.stg .bob{animation:breathe 4s ease-in-out infinite;transform-origin:110px 85px}
.growtop{display:flex;gap:12px;align-items:center;justify-content:space-between}
.growtop>div{min-width:0}
.grow{display:flex;flex-direction:column;gap:10px}
.shard{width:20px;height:20px;fill:var(--accent);stroke:var(--accent-ink);stroke-width:1;flex:none}
.shardbal{display:flex;align-items:center;gap:6px;font-weight:700}
.shardbal b{font-size:1.15rem;color:var(--teal)}
.skymsg{margin:0;color:var(--teal);font-weight:700}
.born{display:flex;gap:12px;align-items:center;background:linear-gradient(175deg,#232867,#10143C);color:#E8EAFB;border:0}
.born h3{color:#fff;margin:2px 0}.born .muted{color:#C6CAEE}
.bsv{width:104px;height:104px;flex:none}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.zk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;background:linear-gradient(175deg,#232867,#10143C);color:#E8EAFB;min-width:0}
.zk svg{width:56px;height:56px}.zk b{font-size:.8rem}.zk span{font-size:.66rem;line-height:1.4;color:#C6CAEE}
.zk.no{background:var(--sunk);color:var(--muted)}
.shardget{display:flex;align-items:center;gap:10px}.shardget>div{flex:1;min-width:0}.shardget .shard{width:28px;height:28px}

/* PDF */
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rung .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

/* ===== 保存（この端末の中） ===== */
const KEY = 'hoshizora-jikan.v1';
const fresh = () => ({ name:'', code:'', days:[], answered:0, correct:0, lessons:{}, known:{}, cards:[], outbox:[], sky:null, lastUnit:'' });
let R = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) R = Object.assign(fresh(), s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(R)); } catch(e) {} };
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => dkey(new Date());
const markDay = () => { const t = today(); if (!R.days.includes(t)) { R.days.push(t); save(); } };
const streak = () => { const set=new Set(R.days); let n=0; const d=new Date(); if(!set.has(today())) d.setDate(d.getDate()-1);
  while(set.has(dkey(d))){ n++; d.setDate(d.getDate()-1); } return n; };

/* ===== 先生への送信（届かなければ次に開いたときに再送） ===== */
function report(item){ R.outbox.push(Object.assign({ app:'星空時間', code:R.code, name:R.name, at:new Date().toISOString() }, item)); save(); flush(); }
function flush(){
  if (!GAS_URL || !R.outbox.length || navigator.onLine === false) return;
  const batch = R.outbox.slice();
  fetch(GAS_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({ items:batch }) })
    .then(() => { R.outbox = R.outbox.slice(batch.length); save(); if (S.view==='settings') render(); })
    .catch(() => {});
}
window.addEventListener('online', flush);

/* ===== 道具 ===== */
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[ri(0,a.length-1)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => { const r=Math.round(n*1000)/1000; return String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
const nfx = n => String(Math.round(n*1000)/1000);
// 数の選択肢：正解＋よくある間違い、足りなければ近い数で4つに
function numChoices(ans, cands, unit=''){
  const out=[ans], seen=new Set([nfx(ans)]);
  for (const c of cands){ if(out.length>=4) break; if(c>0 && isFinite(c) && !seen.has(nfx(c))){ seen.add(nfx(c)); out.push(c);} }
  const step = ans>=20 ? Math.max(1,Math.round(ans/10)) : ans>=2 ? 1 : 0.1; let k=1;
  while(out.length<4){ for(const c of [ans+step*k, ans-step*k]){ const v=Math.round(c*1000)/1000; if(out.length<4 && v>0 && !seen.has(nfx(v))){ seen.add(nfx(v)); out.push(v);} } k++; }
  return shuffle(out.map(v=>nf(v)+unit));
}
const nq = (prompt, expr, ans, wrongs, unit, hint, explain) => ({ prompt, expr, answer:nf(ans)+unit, choices:numChoices(ans,wrongs,unit), hint, explain });

const fq = it => ({ prompt:it[0], expr:it[1], answer:it[2], choices:shuffle([it[2],...it[3]]), words:true, explain:it[4], hint:'説明のページのまとめを思い出してみよう。' });

/* ===== 計算問題 ===== */
const G = {
  unit(){ const k=ri(0,4);
    if(k===0){ const v=pick([0.1,0.2,0.25,0.5,1.5,2]); return nq('単位をそろえよう', `${nf(v)} g ＝ □ mg`, v*1000, [v*100,v*10,v*10000], ' mg', '1 g ＝ 1,000 mg', `1 g ＝ 1,000 mg なので、${nf(v)} × 1,000 ＝ ${nf(v*1000)} mg です。`); }
    if(k===1){ const m=pick([50,100,250,500,1500,2500]); return nq('単位をそろえよう', `${nf(m)} mg ＝ □ g`, m/1000, [m/100,m/10,m*1000], ' g', '1 g ＝ 1,000 mg。mg を g にするときは ÷1,000', `${nf(m)} ÷ 1,000 ＝ ${nf(m/1000)} g です。`); }
    if(k===2){ const v=pick([0.1,0.2,0.25,0.5,2]); return nq('単位をそろえよう', `${nf(v)} mg ＝ □ μg`, v*1000, [v*100,v*10,v*10000], ' μg', '1 mg ＝ 1,000 μg', `1 mg ＝ 1,000 μg なので、${nf(v)} × 1,000 ＝ ${nf(v*1000)} μg です。`); }
    if(k===3){ const v=pick([0.2,0.25,0.5,1.5,2]); return nq('単位をそろえよう', `${nf(v)} L ＝ □ mL`, v*1000, [v*100,v*10,v*10000], ' mL', '1 L ＝ 1,000 mL', `${nf(v)} × 1,000 ＝ ${nf(v*1000)} mL です。`); }
    const m=pick([50,100,250,500,1500]); return nq('単位をそろえよう', `${nf(m)} mL ＝ □ L`, m/1000, [m/100,m/10,m*1000], ' L', 'mL を L にするときは ÷1,000', `${nf(m)} ÷ 1,000 ＝ ${nf(m/1000)} L です。`); },
  pct(){ const c=pick([0.5,1,2,5,10]); return nq('濃度を mg/mL に', `${nf(c)}% の薬液 1 mL に含まれる薬は？`, c*10, [c,c*100,c*1000], ' mg', '1% ＝ 100 mL に 1 g ＝ 1 mL に 10 mg', `1% は 1 mL に 10 mg。${nf(c)}% なら ${nf(c)} × 10 ＝ ${nf(c*10)} mg です。`); },
  conc(){ const [c,lab]=pick([[0.9,'生理食塩液（0.9%）'],[5,'5% ブドウ糖液'],[10,'10% ブドウ糖液'],[20,'20% ブドウ糖液'],[50,'50% ブドウ糖液']]), V=pick([20,100,250,500]), a=c*V/100;
    return nq('溶けている量を求めよう', `${lab} ${V} mL に含まれる溶質は何 g？`, a, [c*V/10,c*V/1000,c*V], ' g', '％（w/v）＝ 100 mL に何 g 溶けているか', `${nf(c)}% は 100 mL に ${nf(c)} g。${V} mL なら ${nf(c)} × ${V} ÷ 100 ＝ ${nf(a)} g です。`); },
  dose(){ const [A,B]=pick([[20,2],[10,1],[40,2],[50,5],[100,10],[25,5],[200,20]]), f=pick([0.25,0.5,0.75,1.5,2]), want=A*f, ans=B*f;
    return nq('必要な薬液量は？', `1アンプル ${A} mg / ${B} mL の注射薬。指示は ${nf(want)} mg。何 mL 吸う？`, ans, [want/A*10,B/f,want/B,ans*2], ' mL', `まず 1 mL に何 mg 入っているか（${A} ÷ ${B}）を求めよう`, `1 mL あたり ${nf(A/B)} mg。${nf(want)} ÷ ${nf(A/B)} ＝ ${nf(ans)} mL です。（比で ${A} : ${B} ＝ ${nf(want)} : x としても同じ）`); },
  rate(){ const [V,h]=pick([[500,4],[500,5],[1000,8],[1000,10],[1000,5],[1500,12],[2000,24],[500,2]]), ans=Math.round(V/h);
    return nq('1時間あたりの量は？', `${V} mL を ${h} 時間で投与。輸液ポンプの設定は何 mL/時？`, ans, [Math.round(V/h/60*10)/10,V*h,Math.round(V/(h*60)*20)], ' mL/時', '総量 ÷ 時間', `${V} ÷ ${h} ＝ ${nf(V/h)}${V%h?' → 約'+ans:''} mL/時 です。`); },
  drip(){ const set=pick([20,60]), [V,h]=pick([[500,4],[500,5],[1000,8],[1000,10],[250,2],[200,4],[500,3],[1000,12]]), x=V*set/(h*60), ans=Math.round(x), other=set===20?60:20;
    return nq('1分間の滴下数は？', `${set===20?'成人用輸液セット（1 mL ≒ 20滴）':'小児用輸液セット（1 mL ≒ 60滴）'}で、${V} mL を ${h} 時間で。1分間に何滴？（小数点以下は四捨五入）`, ans, [Math.round(V*other/(h*60)),Math.round(V*set/h),Math.round(V/(h*60)),ans+10], ' 滴/分', '総量 × 1 mL の滴数 ÷（時間 × 60）', `${V} × ${set} ÷（${h} × 60）＝ ${nf(Math.round(x*100)/100)} → 約 ${ans} 滴/分 です。${set===60?'小児用セットでは「滴/分」と「mL/時」が同じ数になります。':''}`); },
  o2(){ const rem=pick([100,150,200,250,300,400]), P=Math.round(rem*14.7/500*100)/100;
    if(Math.random()<0.5) return nq('ボンベの残量は？', `500 L 酸素ボンベ（満タン 14.7 MPa）の圧力計が ${P} MPa。残量は何 L？`, rem, [Math.round(P*500/10),Math.round(500-P*14.7),rem*2,Math.round(rem/2)], ' L', '残量 ＝ 500 × 現在の圧 ÷ 14.7', `500 × ${P} ÷ 14.7 ＝ ${rem} L です。`);
    const fl=pick([1,2,3,4,5]), t=Math.floor(rem/fl);
    return nq('あと何分使える？', `500 L ボンベの圧力計が ${P} MPa（残量 ${rem} L）。酸素 ${fl} L/分で使うと、あと何分？（切り捨て）`, t, [Math.floor(rem*fl),Math.floor(t/60*10)/10,Math.floor(500/fl),t+10], ' 分', '使える時間 ＝ 残量 ÷ 流量', `${rem} ÷ ${fl} ＝ ${nf(rem/fl)} → ${t} 分。足りなくならないよう端数は切り捨てます。`); },
  pp(){ const d=pick([60,64,70,74,80,86,90]), s=d+pick([30,36,40,44,50,56,60]);
    return nq('脈圧を求めよう', `血圧 ${s}/${d} mmHg の脈圧は？`, s-d, [s+d,Math.round((s+d)/2),d+Math.round((s-d)/3)], ' mmHg', '脈圧 ＝ 収縮期血圧 − 拡張期血圧', `${s} − ${d} ＝ ${s-d} mmHg です。`); },
  map(){ const d=pick([60,66,70,72,78,80,84,90]), p=pick([30,36,39,42,45,48,51,54,60]), s=d+p, m=d+p/3;
    return nq('平均血圧を求めよう', `血圧 ${s}/${d} mmHg の平均血圧は？`, m, [Math.round((s+d)/2),s-d,s-p/3], ' mmHg', '平均血圧 ＝ 拡張期血圧 ＋ 脈圧 ÷ 3', `脈圧は ${s} − ${d} ＝ ${p}。${d} ＋ ${p} ÷ 3 ＝ ${m} mmHg です。`); },
  gcs(){ const e=ri(1,4), v=ri(1,5), m=ri(1,6), t=e+v+m;
    return nq('GCSを合計しよう', `E${e} V${v} M${m} のGCSは？`, t, [t+1,t-1,e*v*m>15?t+2:e*v*m], ' 点', '開眼E・言語V・運動Mの合計', `${e} ＋ ${v} ＋ ${m} ＝ ${t} 点。${t<=8?'8点以下は重症の目安です。':''}`); },
  rr(){ const r=pick([0.5,0.6,0.75,0.8,1,1.2,1.5]), hr=Math.round(60/r);
    return nq('心拍数を求めよう', `心電図のRR間隔が ${nf(r)} 秒。心拍数は？`, hr, [Math.round(r*60),Math.round(100/r),hr+20], ' 回/分', '心拍数 ＝ 60 ÷ RR間隔（秒）', `60 ÷ ${nf(r)} ＝ ${hr} 回/分 です。`); },
};
const makeQs = plan => { const used={}; return plan.map(k=>{ if(G[k]) return G[k](); const P=POOL[k]; used[k]=used[k]||shuffle(P.map((_,i)=>i)); if(!used[k].length) used[k]=shuffle(P.map((_,i)=>i)); return fq(P[used[k].pop()]); }); };

    <tr><td style="white-space:nowrap">${clotIcon('a')}<b>動脈の血栓</b><br><span class="small muted">血小板が中心</span></td><td>動脈硬化の<b>プラークが破れる</b> → 傷に<b>血小板</b>が集まって固まる。<br><span class="small muted">例：心筋梗塞、脳梗塞。予防の中心は抗血小板薬。</span></td></tr>
    <tr><td style="white-space:nowrap">${clotIcon('v')}<b>静脈の血栓</b><br><span class="small muted">フィブリンが中心</span></td><td>血液の流れが<b>よどむ</b>（静脈弁のまわりなど） → <b>凝固因子</b>が働いてフィブリンができ、赤血球を巻きこんで固まる。<br><span class="small muted">例：深部静脈血栓症、心房細動の血栓。予防の中心は抗凝固薬。</span></td></tr></table></div></section>
    <section class="panel"><h3>虚血性心疾患</h3>
    <p><b>冠動脈</b>に血栓ができて、心筋に血液が届かなくなります。</p>
    <p class="small muted">例：不安定狭心症、急性心筋梗塞（8-1）。</p></section>
    <section class="panel"><h3>虚血性脳障害</h3>
    <p><b>脳の血管</b>が血栓でつまり、脳の細胞が傷つきます。</p>
    <p class="small muted">例：脳梗塞、一過性脳虚血発作（TIA）。</p></section>
    <section class="panel"><h3>静脈血栓塞栓症</h3>
    ${chain(['下肢の深い静脈に血栓（深部静脈血栓症）','はがれて流れる','肺動脈につまる（肺血栓塞栓症）'])}
    <p>長時間同じ姿勢でいるときや、手術後の安静などで起こりやすく、<b>エコノミークラス症候群</b>ともよばれます。</p>
    <p class="small muted">予防：早期離床、弾性ストッキング、足首の運動、水分補給。</p></section>
    <section class="panel"><h3>心房細動</h3>
    ${chain(['心房がふるえて血液がよどむ','左心房に血栓','脳に飛んでつまる（心原性脳塞栓症）'])}
    <p class="small muted">7-1 不整脈もあわせて確認しましょう。</p></section>
    <section class="panel">${rule('これらの病気の治療・予防に<br>抗血栓薬を使う')}<p class="small muted" style="margin-top:8px">抗血栓薬には、抗血小板薬・抗凝固薬・血栓溶解薬があります。</p></section>` },
  { id:'11-2', t:'抗血栓薬', sub:'抗血小板薬・抗凝固薬・血栓溶解薬・DOAC', plan:['atd','atd','atd','atd','atd'], body:()=>`
    <section class="panel"><h3>作用機序</h3>
    ${atFig()}
    ${rule('出血傾向の患者には禁忌<br>手術・出血を伴う検査では休薬を検討')}
    <p class="small muted">休薬は、血栓症のリスクと出血のリスクの両方を考えて決めます。</p></section>
    <section class="panel"><h3>① 抗血小板薬</h3>
    <p><b>血小板の凝集</b>をおさえます。</p>
    <p class="small muted">例：アスピリン（バイアスピリン®）、チクロピジン（パナルジン®）、クロピドグレル（プラビックス®）。</p>
    ${rule('アスピリン：解熱・鎮痛薬（NSAIDs）<br>少量では抗血小板薬として働く')}</section>
    <section class="panel"><h3>② 抗凝固薬</h3>
    <p><b>凝固因子</b>の活性化をおさえ、<b>フィブリン</b>ができるのをおさえます。</p>
    <p class="small muted">例：ヘパリン、ワルファリン（ワーファリン®）、ダビガトラン（プラザキサ®）、リバーロキサバン（イグザレルト®）。</p></section>
    <section class="panel"><h3>③ 血栓溶解薬</h3>
    <p>プラスミノゲンを活性化して<b>プラスミン</b>を作り、できた<b>血栓をとかします</b>（線溶）。</p>
    <p class="small muted">例：t-PA、ウロキナーゼ。</p></section>
    <section class="panel"><h3>抗凝固薬とビタミンK</h3>
    ${chain(['ビタミンK','肝臓で凝固因子を作る'])}
    <p><b>ワルファリン</b>はビタミンKに拮抗して、凝固因子ができるのをおさえます。そのため、血液中にビタミンKが多いと効果が<b>弱く</b>なります。</p>
    ${rule('ワルファリン服用中は<br>納豆・青汁などビタミンKの多い食品を控える')}</section>
    <section class="panel"><h3>DOAC</h3>
    <p><b>直接作用型経口抗凝固薬</b>のことです。ワルファリンのほかに使われる抗凝固薬です。</p>
    ${rule('ワルファリンより出血の合併症が少ない<br>食事制限がいらない')}
    <p class="small muted">例：ダビガトラン（プラザキサ®）、リバーロキサバン（イグザレルト®）。</p></section>` },
];

  can:[['汎血球減少','赤血球・白血球・血小板がすべて減ること。貧血・易感染・出血傾向が起こる。'],['シスプラチン','白金製剤。悪心・嘔吐と腎毒性に注意。'],['ホルモン薬','ホルモン依存性のがん（乳がん・子宮体がん・前立腺がん）に使う。副作用はほてり・のぼせ・発汗。'],['分子標的治療薬','がん細胞に特有の分子をねらう薬。例：トラスツズマブ、リツキシマブ、ゲフィチニブ。'],['免疫チェックポイント阻害薬','T細胞へのブレーキを外して攻撃力を取り戻す。例：ニボルマブ。'],['浸潤','がん細胞がまわりの組織にしみこむように広がること。'],['転移','がん細胞が血液やリンパにのって、離れた場所で増えること。'],['癌腫','上皮から生じる悪性腫瘍。例：胃癌、肺癌。'],['肉腫','骨や筋肉など非上皮性の組織から生じる悪性腫瘍。例：骨肉腫。'],['骨髄抑制','骨髄の働きが落ち、白血球・赤血球・血小板が減ること。抗がん薬の代表的な副作用。']],
  avr:[['逆転写酵素','RNAからDNAを作る酵素。HIVが増えるのに必要。ラミブジンが阻害する。'],['プロテアーゼ','タンパク質を切って働く形にする酵素。ダルナビルが阻害する。'],['オセルタミビル','タミフル®。抗インフルエンザ薬。ウイルスが細胞から出ていくのを阻害。'],['アシクロビル','抗ヘルペスウイルス薬。DNA合成を阻害。'],['ウイルス','核酸（DNAかRNAの一方）をカプシドが包んだもの。生きた細胞の中でしか増えない。'],['カプシド','ウイルスの核酸を包むタンパク質の殻。'],['エンベロープ','一部のウイルスがカプシドの外にもつ脂質の膜。例：インフルエンザウイルス、HIV。'],['DNAウイルス','例：ヘルペスウイルス類、B型肝炎ウイルス、HPV、アデノウイルス。'],['RNAウイルス','例：インフルエンザ、麻疹、風疹、ノロ、HIV、A型・C型肝炎ウイルス。']],
  fun:[['アムホテリシンB','ポリエン系。細胞膜傷害。副作用：腎障害、低カリウム血症、肝障害。'],['フルシトシン','ピリミジン系。核酸合成阻害。副作用：骨髄抑制、肝障害、腎障害。'],['アゾール系','フルコナゾールなど。細胞膜合成阻害。白癬にも使う。副作用は少ない。'],['キャンディン系','ミカファンギンなど。細胞壁合成阻害。副作用は少ない。'],['真菌','核膜をもつ真核生物。いわゆるカビや酵母。抗菌薬は効かない。'],['表在性真菌症','皮膚の表面・爪・毛・粘膜に起こる。例：白癬。'],['深部皮膚真菌症','皮下組織や筋、骨に起こる。'],['深在性真菌症','肺・血液などの内臓に起こる。免疫が低下した人に多い。'],['日和見感染','免疫が落ちたとき、ふだんは問題にならない微生物で起こる感染。']],
  abx:[['球菌','丸い形の細菌。例：ブドウ球菌、レンサ球菌、肺炎球菌。'],['桿菌','棒状の細菌。例：大腸菌、緑膿菌、インフルエンザ菌。'],['らせん菌','ねじれた形の細菌。例：コレラ菌、ヘリコバクター、梅毒トレポネーマ。'],['抗菌スペクトル','その抗菌薬が、どの微生物に効くかを表したもの。'],['MRSA','メチシリン耐性黄色ブドウ球菌。多くの抗菌薬が効きにくい。バンコマイシンなどを使う。'],['MIC','最小発育阻止濃度。菌の増殖をおさえる最小の濃度。感性か耐性かの判断に使う。'],['偽膜性大腸炎','抗菌薬で腸内細菌のバランスがくずれ、ほかの菌が増えて起こる腸炎。セフェム系などで注意。'],['内耳神経障害','聴力低下やめまい。アミノグリコシド系の副作用。']],
  ddi:[['薬物相互作用','複数の薬（や食べ物）を一緒にとったとき、効果が強くなったり弱くなったりすること。'],['相加作用','併用の効果が、それぞれの効果の和と同じになる。'],['相乗作用','併用の効果が、それぞれの効果の和より大きくなる。'],['拮抗作用','併用によって効果が弱くなる。例：ビタミンK → ワルファリン。'],['薬物動態学的相互作用','吸収・分布・代謝・排泄の段階で起こる相互作用。例：グレープフルーツ → Ca拮抗薬の血中濃度上昇。']],
  ae:[['TDM','血中薬物濃度モニタリング。血中の薬の濃度を測って投与量を調整すること。'],['安全域','効く濃度と中毒になる濃度のあいだの幅。狭い薬ほど有害事象が起こりやすい。'],['過量毒性','薬が多すぎて、効果が強く出すぎて起こる有害事象。例：インスリン過量 → 低血糖昏睡。'],['狭義の副作用','薬の目的以外の作用で起こる有害事象。例：抗ヒスタミン薬 → 眠気。'],['二次的作用','薬の作用の結果、別の新しい病気が起こるもの。例：抗菌薬 → 偽膜性大腸炎。'],['特異体質','過敏な体質によるアレルギー反応。どの薬でも起こりうる。例：アナフィラキシーショック。'],['菌交代症','抗菌薬で腸内細菌のバランスがくずれ、ふだん少ない菌が増えること。']],
  pk:[['腸肝循環','肝臓から胆汁に出た薬が腸で再吸収され、門脈から肝臓に戻ること。作用が長く続きやすい。'],['舌下投与','舌の下で溶かして口の粘膜から吸収させる。ニトログリセリンなど。'],['経皮投与','貼り薬。ゆっくり持続的に吸収され、血中濃度が安定しやすい。'],['直腸内投与','坐薬。飲めない人にも使え、初回通過効果を一部さけられる。'],['ADME','吸収（A）・分布（D）・代謝（M）・排泄（E）。薬が体に入ってから出ていくまで。'],['吸収','投与した薬が全身をめぐる血液の中に入ること。'],['分布','薬が血液の中から組織へ移ること。作用するのは遊離型。'],['代謝','主に肝臓で薬を分解し、水に溶けやすくして排泄しやすくすること。'],['排泄','薬や代謝物が体の外へ出ること。主に腎臓から尿中へ。'],['初回通過効果','飲み薬が全身に出る前に、肝臓で一部が代謝されること。'],['絶対過敏期','妊娠4〜7週ごろ。胎児の器官がつくられ、薬の影響を受けやすい時期。']],

  cv:[['縦隔','左右の肺にはさまれた胸の中央部分。心臓・大血管・食道・気管などがある。'],['心尖','心臓の先端。左下前方を向き、左第5肋間・鎖骨中線あたりで拍動を触れる。'],['房室弁','心房と心室の間の弁。右が三尖弁、左が僧帽弁。'],['半月弁','心室と動脈の間の弁。肺動脈弁と大動脈弁。'],['洞房結節','右心房にある心臓のペースメーカー。'],['冠動脈','心筋を養う動脈。大動脈の根元から出て、主に拡張期に流れる。'],['門脈','腹部の消化管・脾臓の血液を集めて肝臓へ運ぶ血管。']],

  if(n<16){ for(let i=0;i<9;i++){ const a=rnd()*6.28, d=(n<8?36:22)*rnd(); s+=`<ellipse cx="${(x+Math.cos(a)*d).toFixed(1)}" cy="${(y+Math.sin(a)*d*.6).toFixed(1)}" rx="${26+rnd()*20}" ry="${14+rnd()*10}" fill="hsla(${250+rnd()*40},60%,72%,.16)"/>`; }
    const dots=Math.min(n,15); for(let i=0;i<dots;i++){ const a=rnd()*6.28, d=8+rnd()*40; s+=`<circle cx="${(x+Math.cos(a)*d).toFixed(1)}" cy="${(y+Math.sin(a)*d*.6).toFixed(1)}" r="1.4" fill="#FFF3C9"/>`; }
    if(n>=8) s+=`<circle cx="${x}" cy="${y}" r="16" fill="hsla(280,70%,80%,.35)"/><circle cx="${x}" cy="${y}" r="6" fill="hsla(40,90%,85%,.6)"/>`; }
  else if(n<24){ s=`<ellipse cx="${x}" cy="${y}" rx="64" ry="12" fill="hsla(25,80%,65%,.3)" transform="rotate(-14 ${x} ${y})"/><ellipse cx="${x}" cy="${y}" rx="40" ry="7" fill="hsla(35,90%,75%,.45)" transform="rotate(-14 ${x} ${y})"/><path d="M${x+6} ${y-12} L${x+22} ${y-66} M${x-6} ${y+12} L${x-22} ${y+66}" stroke="hsla(200,90%,85%,.5)" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="14" fill="hsla(40,100%,80%,.45)"/><circle cx="${x}" cy="${y}" r="6" fill="#FFF4D6"/>`; }
  else s=`<circle cx="${x}" cy="${y}" r="46" fill="hsla(260,60%,70%,.1)"/>`+starG({h:48,s:90,l:88,r:n>=30?1.9:1.4},x,y,1);
  return `<svg class="stg" viewBox="0 0 220 170" role="img" aria-label="${g}"><g class="bob">${s}</g></svg>`;
}
function nightSVG(novae){
  const n=novae.length, rnd=seeded(11); let bg=''; for(let i=0;i<60;i++) bg+=`<circle cx="${(rnd()*360).toFixed(1)}" cy="${(rnd()*190).toFixed(1)}" r="${(.4+rnd()*.9).toFixed(2)}" fill="#fff" opacity="${(.25+rnd()*.5).toFixed(2)}"/>`;
  const k=n>16?.62:n>8?.78:.95; let st='';
  novae.slice(-40).forEach((t,i)=>{ const r=seeded((n-novae.slice(-40).length+i)*31+7), x=24+r()*312, y=22+r()*150; st+=`<g class="tw" style="animation-delay:${-(i*1.7)%4}s">${starG(t,x.toFixed(1),y.toFixed(1),k)}</g>`; });
  return `<svg class="night" viewBox="0 0 360 230" role="img" aria-label="夜空　新星 ${n} こ">${bg}${st}${n?'':`<text x="180" y="110" text-anchor="middle" fill="#B9BEE6" font-size="13">まだ新星はありません</text>`}<path d="M0 208 Q60 188 120 200 T240 194 T360 202 V230 H0Z" fill="#05061A"/></svg>`;
}

  <div class="panel"><div class="kv"><span>解いた問題</span><b class="num">${R.answered}問</b></div><div class="kv"><span>正答率</span><b class="num">${acc}%</b></div><div class="kv"><span>連続した日</span><b class="num">${streak()}日</b></div></div>
  ${coll}${viewer}
  ${units.length?units.map(([uid,u])=>`<div class="panel"><h3 style="margin-bottom:6px">${u.subject}　${u.no}　${u.title}</h3>${u.lessons.map(l=>`<div class="kv"><span>${l.id}　${l.t}</span>${lTag(uid,l.id)}</div>`).join('')}</div>`).join(''):'<p class="small muted">星屑（5分の学習）を終えると、ここに記録が並びます。</p>'}</div>`;
}
function vSky(){
  const s=skyInit(), n=Math.min(s.dust,NOVA_NEED), g=growOf(n), nextG=GROW.find(x=>x.at>n), ready=s.dust>=NOVA_NEED, L=S.launched?s.novae[S.launched-1]:null;
  return `<div class="stack"><div class="hello"><div class="eyebrow">夜空</div><h1>星屑を集めて新星を生み出そう</h1></div>
  <div class="skybox">${nightSVG(s.novae)}<div class="skycount"><span>夜空の新星 <b class="num">${s.novae.length}</b> こ</span><span>集めた星屑 <b class="num">${s.total}</b></span></div></div>
  ${L?`<div class="panel born pop"><svg viewBox="0 0 120 120" class="bsv">${starG(L,60,60,2)}</svg><div><p class="small muted">新星が生まれました！</p><h3>新星 No.${S.launched}</h3><p class="small">${hueName(L.h)}色に輝く星になりました。</p></div></div>`:''}
  <div class="panel grow"><div class="growtop"><div><p class="small muted">いま育っている星</p><h3>${g.n}</h3><p class="small">${g.d}</p></div>${stageSVG(n)}</div>
    <div class="meter"><i style="width:${n/NOVA_NEED*100}%"></i></div>
    <div class="shardbal">${SHARD_I}<span>星屑 <b class="num">${s.dust}</b> / ${NOVA_NEED}</span></div>
    <p class="small muted">${ready?'30個そろいました。どんな色の星が生まれるかは、お楽しみ。':(nextG&&nextG.at<NOVA_NEED?`あと <b class="num">${nextG.at-n}</b> 個で${nextG.n}、`:'')+`あと <b class="num">${NOVA_NEED-n}</b> 個で新星を生み出せます。`}</p>
    <button class="btn warm wide" data-act="launch" ${ready?'':'disabled'}>新星を生み出す</button>
    ${ready?'':'<p class="small muted">まだクリアしていない星屑（5分の学習）を1つクリアすると、星屑が1つ集まります。</p>'}</div>
  <div class="panel"><h3>これまでの新星</h3>${s.novae.length?`<div class="list" style="margin-top:10px">${s.novae.map((v,i)=>`<div class="item"><svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">${starG(v,20,20,.9)}</svg><span class="body"><b>新星 No.${i+1}</b><br><span class="small muted">${hueName(v.h)}色</span></span><span class="small muted num">${v.d.replace(/-/g,'.')}</span></div>`).reverse().join('')}</div>`:'<p class="small muted" style="margin-top:6px">星屑を30個集めると、1つめの新星を空にあげられます。</p>'}</div></div>`;
}
function vSettings(){
  const send = !GAS_URL ? `<span class="status">送信先がまだ設定されていません</span>` : R.outbox.length ? `<span class="status wait">送信待ち ${R.outbox.length}件（つながったら送ります）</span>` : `<span class="status ok">先生に送信済み</span>`;
  return `<div class="stack"><div class="hello"><div class="eyebrow">設定</div><h1>学生情報と記録</h1></div>
  <div class="panel stack"><label for="st-code"><b>学籍番号</b></label><input type="text" id="st-code" value="${esc(R.code)}" maxlength="6" autocomplete="off" style="text-transform:uppercase"><p class="small muted">学校の記号＋学年＋番号（例：N101）</p>
  <label for="st-name"><b>呼び名</b></label><input type="text" id="st-name" value="${esc(R.name)}" maxlength="12" autocomplete="off"></div>
  <div class="panel stack"><h3>先生への記録</h3><p class="small">${send}</p><p class="small muted">星屑（5分の学習）を終えるたびに、学籍番号・呼び名・点数・かかった時間が先生に届きます。</p></div></div>`;
}
function vInstall(){
  return `${top('ホーム画面に追加')}<div class="stack">
  <div class="panel stack"><h3>iPhone・iPad（Safari）</h3><ol class="steps"><li>下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」を選ぶ</li><li>右上の「追加」をタップ</li></ol></div>
  <div class="panel stack"><h3>Android（Chrome）</h3><ol class="steps"><li>右上の「︙」メニューをタップ</li><li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li></ol></div></div>`;
}

/* ===== 演習問題（PDF） ===== */
const STAGES = [
  { lv:1, name:'星間雲', desc:'基礎問題', icon:'<ellipse cx="18" cy="26" rx="12" ry="7"/><ellipse cx="30" cy="22" rx="12" ry="8"/>' },
  { lv:2, name:'原始星', desc:'標準問題', icon:'<ellipse cx="24" cy="24" rx="18" ry="5" transform="rotate(-14 24 24)"/><circle cx="24" cy="24" r="5"/>' },
  { lv:3, name:'主系列星', desc:'定期試験対策', icon:'<circle cx="24" cy="24" r="9"/><path d="M24 8v4M24 36v4M8 24h4M36 24h4"/>' },
  { lv:4, name:'巨星', desc:'国家試験レベル', icon:'<circle cx="24" cy="24" r="14"/>' },
  { lv:5, name:'一等星', desc:'国家試験・応用', icon:'<path d="M24 6l5 12 13 1.5-10 9 3 13L24 35l-11 6.5 3-13-10-9 13-1.5z"/>' },
];
function vDrill(){
  const u=CU();
  return `${top(u.no+'　'+u.title+'　演習問題')}<div class="stack"><p class="small muted">この単元の演習問題（PDF）です。印刷しても、画面で解いても大丈夫です。星の一生と同じように、Lv1から順にレベルが上がります。</p>
  <div class="ladder">${STAGES.map(s=>{ const p=PDF[u.drill+'-lv'+s.lv]||{};
    return `<div class="rung"><svg class="stage" viewBox="0 0 48 48" aria-hidden="true">${s.icon}</svg><div class="body"><div class="row" style="gap:8px"><span class="tag">Lv${s.lv}</span><b class="sname">${s.name}</b></div><p class="small">${s.desc}</p>
    ${p.q?`<div class="row"><button class="btn pdfbtn" data-act="pdf" data-arg="${s.lv}|0">問題を開く</button><button class="btn ghost pdfbtn" data-act="pdf" data-arg="${s.lv}|1">解答・解説</button></div>`:'<span class="small muted">準備中</span>'}</div></div>`; }).join('')}</div></div>`;
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLibP=null;
const loadScript = src => new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); });
function pdfLib(){ if(!pdfLibP) pdfLibP=loadScript(PDFJS+'pdf.min.js').then(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; return pdfjsLib; }).catch(e=>{ pdfLibP=null; throw e; }); return pdfLibP; }
function openPdf(arg){ const [lv,i]=arg.split('|'), u=CU(), st=STAGES.find(s=>s.lv===+lv), p=PDF[u.drill+'-lv'+lv]||{};
  S.pdf={ title:`Lv${lv} ${st.name}`, list:[{label:'問題',url:p.q},{label:'解答・解説',url:p.a}], i:+i, z:1, tok:0 }; go('pdf'); }
function vPdf(){ const P=S.pdf;
  return `${top(CU().title+'　'+P.title)}<div class="stack"><div class="pdfbar"><div class="pdfseg">${P.list.map((x,i)=>`<button class="${i===P.i?'on':''}" data-act="pdfTab" data-arg="${i}">${x.label}</button>`).join('')}</div>
  <button class="pdfzoom" data-act="pdfZoom">${P.z>1?'－ 縮小':'＋ 拡大'}</button></div><div id="pdfpages" class="pdfpages"><p class="small muted" style="padding:24px;text-align:center">読みこみ中…</p></div>
  <a class="btn ghost wide pdfbtn" style="text-align:center;text-decoration:none" href="${esc(P.list[P.i].url||'')}" target="_blank" rel="noopener">PDFを別の画面で開く（印刷用）</a></div>`; }
async function renderPdf(){ const P=S.pdf, box=document.getElementById('pdfpages'); if(!box) return; const tok=++P.tok;
  try{ const lib=await pdfLib(), r=await fetch(P.list[P.i].url); if(!r.ok) throw 0; const data=await r.arrayBuffer(); if(tok!==P.tok) return;
    const doc=await lib.getDocument({ data, isEvalSupported:false }).promise; if(tok!==P.tok) return; box.innerHTML='';
    const W=Math.floor(box.clientWidth*P.z), dpr=Math.min(Math.max(window.devicePixelRatio||1,2)*1.5,4);
    for(let n=1;n<=doc.numPages;n++){ const pg=await doc.getPage(n); if(tok!==P.tok) return; const v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:W/v0.width*dpr}), cv=document.createElement('canvas');
      cv.width=vp.width; cv.height=vp.height; cv.className='pdfpage'; cv.style.width=W+'px'; box.appendChild(cv); await pg.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise; } }
  catch(e){ if(tok===P.tok) box.innerHTML='<p class="small muted" style="padding:24px;text-align:center">PDFを読みこめませんでした。下のボタンから開いてください。</p>'; } }

const VIEWS={ setup:vSetup, home:vHome, course:vCourse, subject:vSubject, unit:vUnit, lesson:vLesson, cards:vCards, quiz:vQuiz, result:vResult, record:vRecord, settings:vSettings, install:vInstall, drill:vDrill, pdf:vPdf, sky:vSky };
function render(){
  app.innerHTML=VIEWS[S.view]();
  tabs.hidden = S.view==='setup';
  const tabFor={record:'record',settings:'settings',sky:'sky'}[S.view]||'home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabFor));
  const c=document.getElementById('st-code'), n=document.getElementById('st-name');
  if(c) c.addEventListener('change',e=>{ const v=normCode(e.target.value); if(CODE_RE.test(v)){ R.code=v; save(); } e.target.value=R.code; });
  if(n) n.addEventListener('input',e=>{ R.name=e.target.value.trim(); save(); });
  if (S.view==='pdf') renderPdf();
}
function answerQ(picked){
  const Q=S.quiz, q=Q.qs[Q.i], ok=picked===q.answer; Q.picked=picked; R.answered++;
  if(ok){ Q.score++; R.correct++; } else Q.wrong.push(q);
  markDay(); save(); render();
}

document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ S.stack=[]; S.viewCard=null; S.launched=0; S.view=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, arg=b.dataset.arg;
  if(a==='back') back();
  else if(a==='openReward'){ const rc=b.closest('.rcard'); if(rc) rc.classList.add('open'); b.disabled=true; }
  else if(a==='viewCard'){ S.viewCard=+arg; render(); }
  else if(a==='closeCard'){ S.viewCard=null; render(); }
  else if(a==='meteorClose'){ S.meteor=''; render(); }
  else if(a==='go') go(arg);
  else if(a==='pdf') openPdf(arg);
  else if(a==='pdfTab'){ S.pdf.i=+arg; render(); }
  else if(a==='pdfZoom'){ S.pdf.z=S.pdf.z>1?1:1.8; render(); }
  else if(a==='course'){ if(S.view==='course'){ S.stack.push({v:'course',c:S.course}); S.course=arg; S.view='course'; render(); window.scrollTo(0,0); } else { S.course=arg; go('course'); } }
  else if(a==='subject'){ S.subj=+arg; go('subject'); }
  else if(a==='unit'){ S.uid=arg; go('unit'); }
  else if(a==='setupDone'){ const code=normCode(document.getElementById('su-code').value); if(!CODE_RE.test(code)){ document.getElementById('su-err').hidden=false; return; }
    R.code=code; R.name=document.getElementById('su-name').value.trim(); save(); S.stack=[]; S.view='home'; render(); }
  else if(a==='lesson'){ if(b.dataset.uid) S.uid=b.dataset.uid; S.lid=arg; go('lesson'); }
  else if(a==='lessonNext'){ const u=CU(); S.lid=arg; S.course=u.course; S.subj=u.subj; S.stack=[...navBase(u),'course','subject']; S.view='lesson'; render(); window.scrollTo(0,0); }
  else if(a==='quiz') startQuiz();
  else if(a==='cards'){ if(b.dataset.uid) S.uid=b.dataset.uid; S.deck={cur:deckNext()}; S.flipped=false; markDay(); go('cards'); }
  else if(a==='flip'){ S.flipped=!S.flipped; render(); }
  else if(a==='cardKnown'){ const k=knownList(); if(!k.includes(S.deck.cur)) k.push(S.deck.cur); save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='cardLater'){ const left=terms().map((_,i)=>i).filter(i=>!knownList().includes(i)); S.deck.cur=left[(left.indexOf(S.deck.cur)+1)%left.length]; S.flipped=false; render(); }
  else if(a==='cardsReset'){ R.known[S.uid]=[]; save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='hint'){ S.quiz.hint=true; render(); }
  else if(a==='pick') answerQ(arg);
  else if(a==='next'){ const Q=S.quiz;
    if(Q.i+1<Q.qs.length){ Q.i++; Q.picked=null; Q.hint=false; render(); window.scrollTo(0,0); return; }
    S.reward=null; S.gotShard=false; let chapterJust=false;
    if(!Q.retry){ skyInit(); const u=CU(), l=LX(S.lid), k=lkey(S.uid,l.id), first=!R.lessons[k], wasDone=unitDone(S.uid), n=Q.qs.length, s=R.lessons[k]||{best:0,tries:0,total:n};
      s.tries++; s.best=Math.max(s.best,Q.score); s.total=n; R.lessons[k]=s; R.lastUnit=S.uid; save();
      report({ subject:u.subject, unit:u.no+' '+u.title, lesson:l.id, title:l.t, score:Q.score, total:n, sec:Math.round((Date.now()-S.lessonStart)/1000) });
      chapterJust = !wasDone && unitDone(S.uid);
      if(chapterJust){ // 章をクリア → 流れ星のメッセージ。その項目の章がぜんぶクリアになったらカード
        const sb=courseById(u.course).subjects[u.subj], ready=sb.units.filter(x=>x.ready&&UNITS[x.ready]).map(x=>x.ready), sk=u.course+':'+u.subj;
        R.subjCards=R.subjCards||{};
        if(ready.every(unitDone) && ready.length>(R.subjCards[sk]||0)){ R.subjCards[sk]=ready.length; S.reward=drawReward(); S.reward.title=sb.name; save(); } }
      if(first){ R.sky.dust++; R.sky.total++; S.gotShard=true; save(); } }
    S.meteor = chapterJust ? pick(METEOR_MSGS) : '';
    S.view='result'; render(); window.scrollTo(0,0); }
  else if(a==='retry'){ const list=S.quiz.wrong.map(q=>Object.assign({},q,{choices:shuffle([...q.choices])})); S.view=S.stack.pop()||'lesson'; startQuiz(list); }
  else if(a==='again'){ S.view=S.stack.pop()||'lesson'; startQuiz(); }
  else if(a==='launch'){ launchNova(); render(); window.scrollTo(0,0); }
  else if(a==='toSky'){ S.stack=[]; S.launched=0; S.view='sky'; render(); window.scrollTo(0,0); }
  else if(a==='tounit'){ const u=CU(); S.course=u.course; S.subj=u.subj; S.stack=[...navBase(u),'course']; S.view='subject'; render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.viewCard!=null){ S.viewCard=null; render(); } });

render(); flush();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>


</body></html>
